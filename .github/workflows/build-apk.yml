name: Build Van Supply Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Van Supply project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o "Van-Supply-Admin-GitHub-Free-APK.zip" -d extracted
          rm -rf android
          cp -a extracted/vanandroid-final/android ./android

      - name: Fix Android build configuration
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.vansupply.admin'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vansupply.admin'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'

                  buildConfigField 'String', 'ADMIN_URL', '"https://van-supply.netlify.app/panel-x9-admin"'
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.activity:activity-ktx:1.10.1'
              implementation 'androidx.webkit:webkit:1.12.1'
              implementation 'com.google.firebase:firebase-messaging:24.1.0'
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: van-supply-admin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
