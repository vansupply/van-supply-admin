name: Build Van Supply Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o Van-Supply-Admin-GitHub-Free-APK.zip -d extracted
          cp -a extracted/vanandroid-final/. .

      - name: Enable BuildConfig
        run: |
          sed -i '/android {/a\    buildFeatures {\
          \    buildConfig true\
          \    }' android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: van-supply-admin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
